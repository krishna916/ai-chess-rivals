server:
  port: ${SERVER_PORT:8082}

spring:
  application:
    name: ai-chess-rivals
  config:
    import: optional:file:.env[.properties]
  ai:
    chat:
      client:
        enabled: false
      observations:
        log-prompt: false
        log-completion: false
        include-error-logging: false
    model:
      chat: none
      embedding: none
      image: none
      moderation: none
      audio:
        speech: none
        transcription: none
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5433/aichessrivals}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:secretpassword}
    driver-class-name: org.postgresql.Driver
  flyway:
    enabled: true
    url: ${SPRING_FLYWAY_URL:${spring.datasource.url}}
    user: ${SPRING_FLYWAY_USER:${spring.datasource.username}}
    password: ${SPRING_FLYWAY_PASSWORD:${spring.datasource.password}}
  jpa:
    hibernate:
      ddl-auto: ${SPRING_JPA_HIBERNATE_DDL_AUTO:validate}
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

management:
  server:
    port: 8081
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when-authorized

app:
  ai:
    enabled: ${AI_ENABLED:false}
    groq:
      api-key: ${AI_GROQ_API_KEY:}
      base-url: ${AI_GROQ_BASE_URL:https://api.groq.com/openai/v1}
      model: ${AI_GROQ_MODEL:}
      timeout: 8s
    gemini:
      api-key: ${AI_GEMINI_API_KEY:}
      model: ${AI_GEMINI_MODEL:}
      timeout: 12s
  owner:
    control-token: ${OWNER_CONTROL_TOKEN:}
  match:
    cooldown: ${MATCH_COOLDOWN:60s}
    daily-start-limit: ${MATCH_DAILY_START_LIMIT:12}
  chess:
    stockfish:
      path: ${STOCKFISH_PATH:stockfish/stockfish}
      threads: ${STOCKFISH_THREADS:1}
      hash-mb: ${STOCKFISH_HASH_MB:16}
      startup-timeout-seconds: ${STOCKFISH_STARTUP_TIMEOUT_SECONDS:10}
      move-timeout-seconds: ${STOCKFISH_MOVE_TIMEOUT_SECONDS:30}
      evaluation:
        depth: ${STOCKFISH_EVALUATION_DEPTH:8}
        move-time-millis: ${STOCKFISH_EVALUATION_MOVE_TIME_MILLIS:50}
        major-gain-threshold-centipawns: ${STOCKFISH_MAJOR_GAIN_THRESHOLD_CP:200}
        major-mistake-threshold-centipawns: ${STOCKFISH_MAJOR_MISTAKE_THRESHOLD_CP:200}
  game:
    move-think-time-millis: ${GAME_MOVE_THINK_TIME_MILLIS:250}
    max-plies: ${GAME_MAX_PLIES:300}
    move-delay:
      min: ${GAME_MOVE_DELAY_MIN:3s}
      max: ${GAME_MOVE_DELAY_MAX:10s}
  websocket:
    allowed-origins:
      - ${APP_WEBSOCKET_ALLOWED_ORIGIN:http://localhost:5173}
