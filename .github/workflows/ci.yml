name: CI

on:
  pull_request:
    branches:
      - master
  push:
    branches:
      - master

permissions:
  contents: read

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.changes.outputs.backend }}
      frontend: ${{ steps.changes.outputs.frontend }}
      native: ${{ steps.changes.outputs.native }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Detect relevant paths
        id: changes
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            base_sha="$PR_BASE_SHA"
          else
            base_sha="$BEFORE_SHA"
          fi

          if [[ -z "$base_sha" || "$base_sha" =~ ^0+$ ]]; then
            changed_files="$(git ls-tree -r --name-only "$GITHUB_SHA")"
          else
            changed_files="$(git diff --name-only "$base_sha" "$GITHUB_SHA")"
          fi
          printf '%s\n' "$changed_files"

          backend=false
          frontend=false
          native=false

          while IFS= read -r file; do
            case "$file" in
              server/*)
                backend=true
                native=true
                ;;
              client/*)
                frontend=true
                ;;
              scripts/*)
                backend=true
                frontend=true
                ;;
              .github/workflows/ci.yml)
                backend=true
                frontend=true
                native=true
                ;;
            esac
          done <<< "$changed_files"

          {
            echo "backend=$backend"
            echo "frontend=$frontend"
            echo "native=$native"
          } >> "$GITHUB_OUTPUT"

  backend:
    name: Backend verification
    needs: changes
    if: ${{ needs.changes.outputs.backend == 'true' }}
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: aichessrivals_it
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: secretpassword
        ports:
          - 55433:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d aichessrivals_it"
          --health-interval 1s
          --health-timeout 5s
          --health-retries 60
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
          cache-dependency-path: server/pom.xml

      - name: Prepare Linux Stockfish
        run: ./server/mvnw -f server/pom.xml generate-resources -Plinux

      - name: Verify backend
        env:
          STOCKFISH_PATH: ${{ github.workspace }}/server/stockfish/stockfish
        run: ./server/mvnw -f server/pom.xml verify

  frontend:
    name: Frontend verification
    needs: changes
    if: ${{ needs.changes.outputs.frontend == 'true' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Verify frontend
        run: npm run verify

  native:
    name: Native image verification
    needs:
      - changes
      - backend
    if: ${{ needs.changes.outputs.native == 'true' && needs.backend.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      IMAGE_NAME: ghcr.io/krishna916/ai-chess-rivals-server
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Set up Node.js 22 for native WebSocket smoke
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Build production native image
        uses: docker/build-push-action@v7
        with:
          context: ./server
          file: ./server/Dockerfile
          platforms: linux/amd64
          push: false
          load: true
          tags: ai-chess-rivals:native-ci
          build-args: |
            AI_NATIVE_BUILD_ENABLED=true
          cache-from: type=gha,scope=server-native
          cache-to: type=gha,mode=max,scope=server-native

      - name: Verify AI-enabled topology in native image
        shell: bash
        run: |
          set -euo pipefail

          network="native-ai-verify"
          postgres="native-ai-postgres"
          app="native-ai-app"

          docker network create "$network"

          docker run -d \
            --name "$postgres" \
            --network "$network" \
            -e POSTGRES_DB=aichessrivals \
            -e POSTGRES_USER=postgres \
            -e POSTGRES_PASSWORD=secretpassword \
            postgres:17-alpine

          postgres_ready=false
          for attempt in {1..60}; do
            if docker exec "$postgres" pg_isready -U postgres -d aichessrivals >/dev/null 2>&1; then
              postgres_ready=true
              break
            fi
            sleep 1
          done
          if [[ "$postgres_ready" != true ]]; then
            echo "PostgreSQL did not become ready within 60 seconds"
            docker logs "$postgres"
            exit 1
          fi

          docker run -d \
            --name "$app" \
            --network "$network" \
            -p 8080:8080 \
            -p 8081:8081 \
            -e SERVER_PORT=8080 \
            -e SPRING_DATASOURCE_URL=jdbc:postgresql://native-ai-postgres:5432/aichessrivals \
            -e SPRING_DATASOURCE_USERNAME=postgres \
            -e SPRING_DATASOURCE_PASSWORD=secretpassword \
            -e SPRING_FLYWAY_URL=jdbc:postgresql://native-ai-postgres:5432/aichessrivals \
            -e SPRING_FLYWAY_USER=postgres \
            -e SPRING_FLYWAY_PASSWORD=secretpassword \
            -e OWNER_CONTROL_TOKEN=0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef \
            -e AI_ENABLED=true \
            -e AI_OPENROUTER_API_KEY=ci-runtime-openrouter-key \
            -e AI_OPENROUTER_PRIMARY_MODEL=ci-runtime-primary:free \
            -e AI_OPENROUTER_FALLBACK_MODEL=ci-runtime-fallback \
            ai-chess-rivals:native-ci

          for attempt in {1..60}; do
            if curl -fsS http://localhost:8081/actuator/health >/dev/null 2>&1; then
              break
            fi

            if [[ "$(docker inspect -f '{{.State.Running}}' "$app")" != "true" ]]; then
              docker logs "$app"
              exit 1
            fi

            sleep 2
          done

          if ! curl -fsS http://localhost:8081/actuator/health; then
            docker logs "$app"
            exit 1
          fi

          if ! node --input-type=module <<'NODE'
          const url = "ws://127.0.0.1:8080/ws/match";

          await new Promise((resolve, reject) => {
            let receivedInitialMessage = false;
            const socket = new WebSocket(url);

            const timeout = setTimeout(() => {
              socket.close();
              reject(new Error(`Timed out waiting for the initial WebSocket frame from ${url}`));
            }, 10_000);

            socket.addEventListener("message", (event) => {
              try {
                const message = JSON.parse(String(event.data));
                if (message.type !== "NO_MATCH") {
                  throw new Error(
                    `Expected initial NO_MATCH frame from an empty CI database, received ${event.data}`,
                  );
                }
                if (message.payload === null || typeof message.payload !== "object") {
                  throw new Error(`Expected NO_MATCH payload object, received ${event.data}`);
                }

                receivedInitialMessage = true;
                clearTimeout(timeout);
                socket.close();
                resolve();
              } catch (error) {
                clearTimeout(timeout);
                socket.close();
                reject(error);
              }
            });

            socket.addEventListener("close", (event) => {
              if (!receivedInitialMessage) {
                clearTimeout(timeout);
                reject(
                  new Error(
                    `WebSocket closed before its initial frame: code=${event.code} reason=${event.reason}`,
                  ),
                );
              }
            });

            socket.addEventListener("error", () => {
              clearTimeout(timeout);
              reject(new Error(`WebSocket connection failed for ${url}`));
            });
          });

          console.log("Native WebSocket initial NO_MATCH serialization verified");
          NODE
          then
            echo "Native WebSocket serialization smoke failed"
            docker logs "$app"
            exit 1
          fi

          log_file="/tmp/native-ai-app.log"
          docker logs "$app" > "$log_file" 2>&1

          if grep -Fq "Record components not available for record class" "$log_file"; then
            echo "Native application emitted a GraalVM record-component reflection failure"
            grep -F "Record components not available for record class" "$log_file" || true
            exit 1
          fi

          enabled_marker="AI gateway topology: enabled (OpenRouter primary -> OpenRouter fallback -> deterministic fallback)"
          disabled_marker="AI gateway topology: disabled"

          if ! grep -Fq "$enabled_marker" "$log_file"; then
            echo "Expected AI-enabled native topology marker was not emitted"
            echo "AI topology markers found in application logs:"
            grep -F "AI gateway topology:" "$log_file" || true
            docker logs "$app"
            exit 1
          fi

          if grep -Fq "$disabled_marker" "$log_file"; then
            echo "AI-disabled topology marker was emitted by the AI-enabled native artifact"
            echo "AI topology markers found in application logs:"
            grep -F "AI gateway topology:" "$log_file" || true
            docker logs "$app"
            exit 1
          fi

          image_env="$(docker image inspect ai-chess-rivals:native-ci --format '{{range .Config.Env}}{{println .}}{{end}}')"
          if grep -Eq '^AI_OPENROUTER_(API_KEY|PRIMARY_MODEL|FALLBACK_MODEL)=' <<< "$image_env"; then
            echo "OpenRouter credential/model environment values are baked into the final image"
            exit 1
          fi

      - name: Clean up native topology verification
        if: ${{ always() }}
        shell: bash
        run: |
          docker rm -f native-ai-app native-ai-postgres 2>/dev/null || true
          docker network rm native-ai-verify 2>/dev/null || true

      - name: Log in to GitHub Container Registry
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/master' }}
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish verified backend image
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/master' }}
        shell: bash
        run: |
          set -euo pipefail

          sha_image="${IMAGE_NAME}:${GITHUB_SHA}"
          latest_image="${IMAGE_NAME}:latest"

          docker image inspect ai-chess-rivals:native-ci >/dev/null
          docker tag ai-chess-rivals:native-ci "$sha_image"
          docker tag ai-chess-rivals:native-ci "$latest_image"
          docker push "$sha_image"
          docker push "$latest_image"

      - name: Trigger Render image deployment
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/master' }}
        shell: bash
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          set -euo pipefail

          if [[ -z "$RENDER_DEPLOY_HOOK_URL" ]]; then
            echo "RENDER_DEPLOY_HOOK_URL is not configured. The GHCR image was published, but Render deployment cannot start."
            exit 1
          fi

          curl --fail-with-body --silent --show-error --get \
            --data-urlencode "imgURL=${IMAGE_NAME}:${GITHUB_SHA}" \
            "$RENDER_DEPLOY_HOOK_URL"
