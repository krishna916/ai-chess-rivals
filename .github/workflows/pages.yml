name: Deploy frontend to GitHub Pages

on:
  push:
    branches:
      - master
    paths:
      - "client/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    name: Verify, build and deploy frontend
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    env:
      VITE_API_URL: ${{ vars.VITE_API_URL }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Install frontend dependencies
        run: npm ci

      - name: Validate production API URL
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${VITE_API_URL}" ]]; then
            echo "GitHub Actions repository variable VITE_API_URL is not configured."
            exit 1
          fi

      - name: Verify and build frontend
        run: npm run verify

      - name: Reject localhost backend references in production bundle
        shell: bash
        run: |
          set -euo pipefail
          if grep -R -F "localhost:8082" dist; then
            echo "Production bundle contains a localhost backend reference."
            exit 1
          fi

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: client/dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
